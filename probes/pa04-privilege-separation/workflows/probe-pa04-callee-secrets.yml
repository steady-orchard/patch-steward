# PA04 probe, Q4 re-probe of PA04.1 (secret wiring): reusable workflow called from ANOTHER repository, pinned by
# commit SHA. Unlike probe-pa04-callee.yml it DECLARES the secret under on.workflow_call.secrets, so a caller can pass
# it with an explicit mapping (wiring W1) or with `secrets: inherit` (wiring W2). Job with-env declares the Environment
# probe-pa04-env; job without-env does not. Each job prints only the length and the origin of
# secrets.PROBE_PA04_ENV_MARKER (its SHA-256 digest matched against the three DUMMY markers), never the value:
#   org-public  probe-pa04-marker-org-public
#   org-private probe-pa04-marker-org-private
#   personal    probe-pa04-marker-personal
# No job references any other secret: under `secrets: inherit` the caller's other repository secrets are in the
# secrets context but never reach a job environment.
# Canonical source: probes/pa04-privilege-separation/workflows/probe-pa04-callee-secrets.yml
# Deployed copy:    .github/workflows/probe-pa04-callee-secrets.yml on master of the hosts (byte-identical).
name: probe-pa04-callee-secrets

on:
  workflow_call:
    inputs:
      leg:
        description: Which call leg this is (w1-host-org-public, w2-host-org-public, w1-host-personal, w2-host-personal)
        required: true
        type: string
    secrets:
      PROBE_PA04_ENV_MARKER:
        description: DUMMY Environment marker, passed by an explicit mapping (W1) or by secrets inherit (W2)
        required: false

permissions: {}

jobs:
  with-env:
    name: with-env
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: probe-pa04-env
    permissions: {}
    steps:
      - name: Report the origin of the secret in a called job that declares the Environment
        env:
          MARKER: ${{ secrets.PROBE_PA04_ENV_MARKER }}
          LEG: ${{ inputs.leg }}
        run: |
          d="$(printf '%s' "$MARKER" | sha256sum | cut -d ' ' -f 1)"
          case "$d" in
            16e562bad4a54896263f6875672440fae0271c1b37cdd746a48eb00b06089501) origin=org-public ;;
            244acb019505f578c648954cfddca5b20400928738528b1be5170206991d74fa) origin=org-private ;;
            52080ed5b0043db8cdf2d84a739b72662260353b093332fcf472471e04712901) origin=personal ;;
            e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855) origin=empty ;;
            *) origin=other ;;
          esac
          echo "PROBE-PA04 leg=$LEG job=callee/with-env repository=$GITHUB_REPOSITORY workflow_ref=$GITHUB_WORKFLOW_REF secret_length=${#MARKER} secret_origin=$origin"

  without-env:
    name: without-env
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report the origin of the secret in a called job without the Environment
        env:
          MARKER: ${{ secrets.PROBE_PA04_ENV_MARKER }}
          LEG: ${{ inputs.leg }}
        run: |
          d="$(printf '%s' "$MARKER" | sha256sum | cut -d ' ' -f 1)"
          case "$d" in
            16e562bad4a54896263f6875672440fae0271c1b37cdd746a48eb00b06089501) origin=org-public ;;
            244acb019505f578c648954cfddca5b20400928738528b1be5170206991d74fa) origin=org-private ;;
            52080ed5b0043db8cdf2d84a739b72662260353b093332fcf472471e04712901) origin=personal ;;
            e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855) origin=empty ;;
            *) origin=other ;;
          esac
          echo "PROBE-PA04 leg=$LEG job=callee/without-env repository=$GITHUB_REPOSITORY secret_length=${#MARKER} secret_origin=$origin"
